<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="main.js" type="module"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <h1>dis our title for da project</h1>
    <div id="container">
      <div id="contestants">
        <h3>Contestant Lineup</h3>
        <!-- Checkbox to toggle color -->
        <label>
          <input type="checkbox" id="toggleColor" />
        </label>

        <!-- Input to name the silhouette -->
        <label>
          <input type="text" id="figureName" placeholder="Enter Contestant Name" />
        </label>

        <!-- Body container -->
        <div class="body-container">
          <img class="silhouette" src="silhouette.png" alt="Body silhouette" />
          <div class="overlay"></div>
        </div>

        <!-- Display the silhouette name -->
        <p id="nameDisplay">Contestant #1</p>
      </div>
      <div id="chatbox">
        <h3>Scoreboard</h3>
      </div>
    </div>
    <div id="graph-container">
      <h1>Now analyze the data!</h1>
      <div id="graphs"></div>
        <dl id="tooltip" class="info tooltip" hidden>
          <dt id="agerange">Age Range</dt>
          <dd id="agerange_value"></dd>
          <dt id="measurement_name"></dt>
          <dd id="measurement_value"></dd>
          <dt id="time">Time to Completion</dt>
          <dd id="time_value"></dd>
        </dl>
    </div>
  </body>
</html>
